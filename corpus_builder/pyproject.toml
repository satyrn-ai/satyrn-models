[project]
name = "satyrn-corpus-builder"
version = "0.1.0"
description = "Satyrn Dataset Builder"
requires-python = ">=3.14"
dependencies = [
    "click",
]

[project.scripts]
satyrn-dataset = "satyrn.dataset.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
