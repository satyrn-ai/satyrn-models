[project]
name = "satyrn-corpus-builder"
version = "0.1.0"
description = "Satyrn Dataset Builder"
requires-python = ">=3.13"
dependencies = [
    "click",
    "flask>=3.1.3",
    "jsonschema",
    "openai",
    "python-dotenv",
    "rich",
    "sphinx~=9.1.1", # Keep in sync with `cpython/Doc/requirements.txt`
    "sphinx-markdown-builder",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff==0.17.5"]

[project.scripts]
satyrn-dataset = "satyrn.dataset.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
