[project]
name = "satyrn-corpus-builder"
version = "0.1.0"
description = "Satyrn Dataset Builder"
requires-python = ">=3.13"
dependencies = [
    "click",
    "jsonschema",
    "openai",
    "python-dotenv",
    "rich",
    "sphinx>=8.2,<9",  # Keep in sync with `cpython/Doc/requirements.txt`
    "sphinx-markdown-builder",
    "tqdm",
]

[project.scripts]
satyrn-dataset = "satyrn.dataset.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
