line-length = 120
# Agent-eval tasks' starting code is deliberately imperfect: seeded bugs, and messy code a model should leave alone
extend-exclude = ["trainer/unsloth/src/satyrn/trainer/unsloth/eval/agent_tasks/*/base"]

[lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # isort (import sorting)
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[lint.isort]
known-first-party = ["satyrn"]
known-third-party = ["datasets"]
