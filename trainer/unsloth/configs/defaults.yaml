load_in_4bit: false
max_seq_length: 8192

batch_size: 8
gradient_accumulation_steps: 2
optim: paged_adamw_8bit
logging_steps: 10
eval_ratio: 0.1

model:
  peft:
    # r - must be explicitly set by model or experiment config
    lora_alpha: ${mul:${.r},2} # r * 2 by default
    lora_dropout: 0.0
    target_modules: null
    finetune_attention_modules: true
    finetune_mlp_modules: true
    finetune_language_layers: true
    finetune_vision_layers: false
    finetune_audio_layers: false

mlflow:
  tracking_uri: https://mlflow.satyrn.ai

datasets:
  cpt: null
  sft: null
  rl: null

cpt:
  packing: true
  num_train_epochs: 1
  learning_rate: 1e-4

sft:
  num_train_epochs: 1
  learning_rate: 2e-4

rl:
  num_generations: 8
  max_prompt_length: 1024
  max_completion_length: 1024
  learning_rate: 1e-6
  reward_funcs: ["interpreter_reward"]

hydra:
  run:
    dir: results/${now:%Y%m%d-%H%M}-${run_name}
