# Architecture: MoE, 128 experts / 8 active, 30 layers, sliding + full attention (5:1)
# Thinking:     opt-in, gemma-4-thinking template
# Multimodal:   text + vision
# VRAM:         ~49GB peak at max_seq_length 8192, on an A100-80GB
# transformers: 5.5.0
#
# Reference Unsloth notebook:
# https://github.com/unslothai/notebooks/blob/main/nb/Gemma4_(26B_A4B)-Text.ipynb
#
# model = FastModel.get_peft_model(
#     model,
#     finetune_vision_layers     = False,
#     finetune_language_layers   = True,
#     finetune_attention_modules = True,
#     finetune_mlp_modules       = True,
#     r = 8,           # Larger = higher accuracy, but might overfit
#     lora_alpha = 8,  # Recommended alpha == r at least
#     lora_dropout = 0,
#     bias = "none",
# )
name: unsloth/gemma-4-26B-A4B-it

template:
  instruction_part: "<|turn>user\n"
  response_part: "<|turn>model\n"

peft:
  r: 8
  lora_alpha: 8
  lora_dropout: 0.0
  # With target_modules null the 128 experts are reached through the synthesized regex,
  # training 247M params (at r=8). finetune_mlp_modules: false leaves attention only.
