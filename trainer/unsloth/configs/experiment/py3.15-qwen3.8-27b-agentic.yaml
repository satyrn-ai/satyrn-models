# @package _global_
defaults:
  - /defaults
  - /model: qwen3.8-27b
  - _self_

run_name: py3.15-Qwen3.8-27B-agentic

mlflow:
  experiment_name: Qwen3.8-27B

pre_model_eval: false

datasets:
  sft:
    - datasets/python3.14/sft.jsonl
    - datasets/python3.14/sft-PEP750.jsonl
    - datasets/python3.15/sft.jsonl
    - datasets/python3.15/sft2.jsonl
    - datasets/python3.14/sft-agentic.jsonl
    - datasets/python3.15/sft-agentic.jsonl

sft:
  seq_len: 16384
  batch_size: 5
  eval_batch_size: 1
  eval_steps: 25
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 2e-4
