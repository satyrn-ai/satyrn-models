# @package _global_
defaults:
  - /defaults
  - /model: qwen3.8-27b
  - _self_

run_name: py3.15-Qwen3.8-27B-agentic

mlflow:
  experiment_name: Qwen3.8-27B

pre_model_eval: false

datasets:
  cpt:
    - datasets/python3.14/cpt.jsonl
    - datasets/python3.15/cpt.jsonl
    - datasets/cpt/web.jsonl
    - datasets/cpt/misc.jsonl
  sft:
    - datasets/python3.14/sft.jsonl
    - datasets/python3.14/sft-PEP750.jsonl
    - datasets/python3.14/sft3.jsonl
    - datasets/python3.15/sft2.jsonl
    - datasets/python3.15/sft3.jsonl
    - datasets/python3.14/sft-agentic.jsonl
    - datasets/python3.15/sft-agentic.jsonl

cpt:
  eval_batch_size: 1
  num_train_epochs: 1
  learning_rate: 5e-5
  prepack_dataset: true

sft:
  seq_len: 16384
  batch_size: 5
  eval_batch_size: 1
  eval_steps: null
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  learning_rate: 1e-4
