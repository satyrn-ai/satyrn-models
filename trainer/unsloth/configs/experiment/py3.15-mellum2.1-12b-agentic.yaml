# @package _global_
defaults:
  - /defaults
  - /model: mellum2.1-12b-a2.5b
  - _self_

run_name: py3.15-Mellum2.1-12B-A2.5B-Thinking-agentic

mlflow:
  experiment_name: Mellum2.1-12B-A2.5B-Thinking

pre_model_eval: false

model:
  peft:
    r: 64

datasets:
  cpt:
    - datasets/python3.14/cpt.jsonl
    - datasets/python3.15/cpt.jsonl
    - datasets/cpt/web.jsonl
    - datasets/cpt/misc.jsonl
  sft:
    - datasets/python3.14/sft3.jsonl
    - datasets/python3.15/sft3.jsonl
    - datasets/python3.14/sft-agentic.jsonl
    - datasets/python3.15/sft-agentic.jsonl

cpt:
  eval_batch_size: 1
  num_train_epochs: 1
  learning_rate: 3e-5
  prepack_dataset: true

sft:
  seq_len: 18432
  batch_size: 6
  eval_batch_size: 1
  eval_steps: null
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  learning_rate: 1e-4
