# @package _global_
defaults:
  - /defaults
  - /model: mellum2.1-12b-a2.5b
  - _self_

run_name: py3.15-Mellum2.1-12B-A2.5B-Thinking

mlflow:
  experiment_name: Mellum2.1-12B-A2.5B-Thinking

datasets:
  cpt:
    - datasets/python3.14/cpt.jsonl
    - datasets/python3.15/cpt.jsonl
  sft:
    - datasets/python3.14/sft.jsonl
    - datasets/python3.14/sft-PEP750.jsonl
    - datasets/python3.15/sft.jsonl
    - datasets/python3.15/sft2.jsonl
  rl:
    - datasets/python3.14/rl-PEP750.jsonl

cpt:
  seq_len: 4096
  batch_size: 8
  eval_batch_size: 1
  eval_steps: 4
  num_train_epochs: 3
  learning_rate: 1e-4
  prepack_dataset: true

sft:
  seq_len: 1280
  batch_size: 24
  eval_batch_size: 4
  eval_steps: 10
  num_train_epochs: 1
  learning_rate: 2e-4

rl:
  batch_size: 16
  num_generations: 8
  max_completion_length: 1024
  num_train_epochs: 8
  learning_rate: 5e-6
