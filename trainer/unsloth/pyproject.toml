[project]
name = "satyrn-unsloth"
version = "0.1.0"
description = "Satyrn Unsloth Trainer"
requires-python = ">=3.13.9,<3.15"
dependencies = [
    "unsloth==2026.11.5",
    "unsloth-zoo==2026.11.5",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "xformers==0.0.35; sys_platform != 'darwin'",
    "datasets==4.8.5",
    "pydantic",
    "python-dotenv",
    "hydra-core>=1.4.0rc3",
    "omegaconf>=2.4.1rc1",
    "mlflow==3.18.0",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pyrsmi>=1.1.0",
    "inspect-ai==0.3.290",
    "inspect-evals==0.29.0",
    "agent-client-protocol==1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff==0.17.5"]

[project.scripts]
satyrn-unsloth = "satyrn.trainer.unsloth.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
