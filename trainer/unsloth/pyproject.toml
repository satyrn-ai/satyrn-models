[project]
name = "satyrn-unsloth"
version = "0.1.0"
description = "Satyrn Unsloth Trainer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unsloth==2026.8.5",
    "unsloth-zoo==2026.8.5",
    "pydantic",
    "python-dotenv",
    "hydra-core>=1.4.0.dev8",
    "omegaconf>=2.4.0.dev13",
    "mlflow==3.15.1",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pyrsmi>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff==0.16.2"]

[project.scripts]
satyrn-unsloth = "satyrn.trainer.unsloth.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
