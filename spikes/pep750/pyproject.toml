[project]
name = "satyrn-model"
version = "0.1.0"
description = "PEP 750 spike: dataset generation, evaluation, and the quarantined 2025 legacy examples"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "unsloth"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn_model"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
