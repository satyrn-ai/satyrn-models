[project]
name = "satyrn-tstrings"
version = "0.1.0"
description = "T-strings training spike, clean-room rebuild"
requires-python = ">=3.14"
dependencies = [
    "click",
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@254d153fdeb6f150edd4fc5a54f9828638481fa8",
    "satyrn-corpus-builder",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff==0.16.2"]

[project.scripts]
satyrn-tstrings = "satyrn.tstrings.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
satyrn-corpus-builder = { path = "../../corpus_builder" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
