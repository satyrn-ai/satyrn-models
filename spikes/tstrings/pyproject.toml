[project]
name = "satyrn-model"
version = "0.1.0"
description = "Verification, measurement, and training provider for t-string datasets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
authoring = "satyrn_model.authoring.cli:main"  # stub — see cli.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn_model"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
