# SP5 source policy. Individual [[source]] records are added only after Task 1
# validates their immutable ref, SPDX identifier, and attribution fields.

[policy]
allowed_licenses = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "PSF-2.0",
]
require_spdx_identifier = true
require_attribution = true
require_snapshot_license_inventory = true
require_notice_for_license_text = true

[[source]]
id = "cpython-v3.14.5"
url = "https://github.com/python/cpython"
sha = "0808dbf5e558cde2b71fd679ccc77a4859943b82"  # git ls-remote refs/tags/v3.14.5
license = "PSF-2.0"
attribution = "Python Software Foundation (python.org). CPython tag v3.14.5."
source_class = "cpython"
extraction_mode = "ast"
tag = "v3.14.5"
notice = """
Copyright (c) 2001-2026 Python Software Foundation; All Rights Reserved.
Licensed under the Python Software Foundation License Version 2.
"""

[source.expected_contribution]
test_methods = "Lib/test/test_string/test_templatelib.py"
literals = ">=0"
