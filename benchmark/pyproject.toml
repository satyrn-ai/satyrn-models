[project]
name = "satyrn-benchmark"
version = "0.1.0"
description = "Satyrn Model Benchmarks"
requires-python = ">=3.13"
dependencies = [
    "click",
    "evalplus==0.3.1",
    "hf-transfer>=0.1.9",
    "huggingface-hub==0.36.2",
]

[project.scripts]
satyrn-benchmark = "satyrn.benchmark.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
