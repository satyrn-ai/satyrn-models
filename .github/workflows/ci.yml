name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pipx install ruff==0.16.2

      - name: Lint
        run: ruff check trainer corpus_builder

      - name: Check formatting
        run: ruff format --check trainer corpus_builder

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install both modules
        run: uv pip install -e './corpus_builder[dev]' -e './trainer/unsloth[dev]'

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus_builder/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: corpus_builder/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
