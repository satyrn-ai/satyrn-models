name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pipx install ruff==0.16.2

      - name: Lint
        run: ruff check trainer corpus_builder

      - name: Check formatting
        run: ruff format --check trainer corpus_builder

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install both modules
        run: uv pip install --system -e 'corpus_builder[dev]' -e 'trainer/unsloth[dev]'

      - name: Run smoke tests
        run: pytest -v
